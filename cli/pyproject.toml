[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelestia-niri-cli"
version = "0.1.0"
description = "Wallpaper/scheme/record helper for the Caelestia shell on niri (trimmed fork of caelestia-dots/cli)"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = ["pillow", "materialyoucolor"]

[project.scripts]
caelestia = "caelestia:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caelestia"]
